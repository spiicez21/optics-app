<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories — OpticShop Admin</title>
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .cat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .cat-card {
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: box-shadow .2s, transform .15s;
            cursor: default;
        }

        .cat-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .cat-card-img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .cat-card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cat-card-body {
            padding: 14px;
        }

        .cat-card-name {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .cat-card-count {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .cat-card-actions {
            display: flex;
            gap: 8px;
        }
    </style>
</head>
<body>
<!-- ── Sidebar ── -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
        <div class="logo-icon">👓</div>
        <span>OpticShop</span>
    </div>
    <nav class="sidebar-nav">
        <span class="nav-section-label">Main</span>
        <a href="dashboard.html"  class="nav-link"><span class="nav-icon">📊</span>Dashboard</a>
        <a href="products.html"   class="nav-link"><span class="nav-icon">🛍️</span>Products</a>
        <a href="categories.html" class="nav-link active"><span class="nav-icon">🏷️</span>Categories</a>
        <a href="orders.html"     class="nav-link"><span class="nav-icon">📦</span>Orders</a>
    </nav>
    <div class="sidebar-footer">
        <button class="nav-link" id="logoutBtn" style="width:100%;background:none;border:none;cursor:pointer;color:rgba(255,255,255,.65);font-size:14px;font-weight:500;">
            <span class="nav-icon">🚪</span>Logout
        </button>
    </div>
</aside>

<!-- ── Main ── -->
<div class="main-wrapper">
    <header class="topbar">
        <span class="topbar-title">Categories</span>
        <div class="topbar-right">
            <span id="adminEmail" style="font-size:13px;color:var(--text-muted);"></span>
            <div class="admin-avatar" id="adminAvatar">A</div>
        </div>
    </header>

    <main class="page-content">
        <div class="card">
            <div class="toolbar">
                <div class="toolbar-left">
                    <div class="search-bar">
                        <span>🔍</span>
                        <input type="text" id="searchInput" placeholder="Search categories…">
                    </div>
                </div>
                <div class="toolbar-right">
                    <button class="btn btn-primary" id="addCatBtn">＋ Add Category</button>
                </div>
            </div>

            <div id="catGrid" class="cat-grid">
                <p class="text-muted" style="grid-column:1/-1;text-align:center;padding:40px;">Loading…</p>
            </div>
        </div>
    </main>
</div>

<!-- ── Add / Edit Category Modal ── -->
<div class="modal-overlay" id="catModal">
    <div class="modal">
        <div class="modal-header">
            <span class="modal-title" id="catModalTitle">Add Category</span>
            <button class="modal-close" id="closeCatModal">✕</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="editCatId">

            <div class="form-group">
                <label class="form-label">Category Name *</label>
                <input type="text" class="form-control" id="cName" placeholder="e.g. Sunglasses">
            </div>

            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea class="form-control" id="cDescription" rows="2" placeholder="Brief description…" style="resize:vertical;"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Icon / Emoji</label>
                <input type="text" class="form-control" id="cIcon" placeholder="e.g. 🕶️" maxlength="4">
                <span class="text-muted fs-12 mt-4" style="display:block;">Used as placeholder when no image is set.</span>
            </div>

            <div class="form-group">
                <label class="form-label">Image URL</label>
                <input type="url" class="form-control" id="cImageUrl" placeholder="https://…" oninput="previewCatImg(this.value)">
                <div style="margin-top:10px;">
                    <img id="catImgPreview" src="" alt="" style="max-width:120px;max-height:80px;border-radius:8px;display:none;object-fit:cover;border:1px solid var(--border);">
                </div>
            </div>

            <div class="form-check">
                <input type="checkbox" id="cFeatured">
                <label for="cFeatured">Show on home / featured</label>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelCatBtn">Cancel</button>
            <button class="btn btn-primary" id="saveCatBtn">Save Category</button>
        </div>
    </div>
</div>

<!-- ── Delete Confirm Modal ── -->
<div class="modal-overlay" id="deleteCatModal">
    <div class="modal" style="max-width:400px;">
        <div class="modal-header">
            <span class="modal-title">Delete Category</span>
            <button class="modal-close" id="closeDeleteCatModal">✕</button>
        </div>
        <div class="modal-body">
            <p>Are you sure you want to delete <strong id="deleteCatName"></strong>? Products in this category will not be deleted but will lose their category assignment.</p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelDeleteCatBtn">Cancel</button>
            <button class="btn btn-danger" id="confirmDeleteCatBtn">Delete</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import {
    auth, db, requireAuth, showToast,
    collection, getDocs, addDoc, updateDoc, deleteDoc, doc, query, orderBy, where, getCountFromServer,
    signOut
} from './js/firebase-config.js';

const user = await requireAuth();
document.getElementById('adminEmail').textContent = user.email;
document.getElementById('adminAvatar').textContent = (user.email?.[0] ?? 'A').toUpperCase();

document.getElementById('logoutBtn').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = 'index.html';
});

/* ── State ── */
let allCategories = [];
let pendingDeleteId = null;

/* ── Load categories ── */
async function loadCategories() {
    const grid = document.getElementById('catGrid');
    try {
        const snap = await getDocs(query(collection(db, 'categories'), orderBy('name')));
        allCategories = [];
        snap.forEach(d => allCategories.push({ id: d.id, ...d.data() }));
        applyFilter();
    } catch(e) {
        grid.innerHTML = `<p class="text-danger" style="grid-column:1/-1;text-align:center;padding:40px;">Failed to load categories.</p>`;
        console.error(e);
    }
}

/* ── Get product count per category ── */
async function getCatProductCount(catId) {
    try {
        const snap = await getCountFromServer(
            query(collection(db, 'products'), where('categoryId', '==', catId))
        );
        return snap.data().count;
    } catch { return null; }
}

/* ── Filter ── */
function applyFilter() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allCategories.filter(c =>
        !search || c.name?.toLowerCase().includes(search)
    );
    renderGrid(filtered);
}

document.getElementById('searchInput').addEventListener('input', applyFilter);

/* ── Render grid ── */
function renderGrid(cats) {
    const grid = document.getElementById('catGrid');
    if (cats.length === 0) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="empty-icon">🏷️</div><p>No categories found.</p></div>`;
        return;
    }

    grid.innerHTML = cats.map(c => `
    <div class="cat-card">
        <div class="cat-card-img" id="cat-img-${c.id}">
            ${c.imageUrl
                ? `<img src="${c.imageUrl}" alt="${c.name}" onerror="this.parentElement.innerHTML='${c.icon ?? '🏷️'}';">`
                : (c.icon ?? '🏷️')}
        </div>
        <div class="cat-card-body">
            <div class="cat-card-name">${c.name ?? '—'}</div>
            <div class="cat-card-count">${c.description ? c.description.slice(0,50) + (c.description.length>50?'…':'') : 'No description'}</div>
            ${c.featured ? '<span class="badge badge-orange" style="margin-bottom:8px;">Featured</span>' : ''}
            <div class="cat-card-actions">
                <button class="btn btn-secondary btn-sm" style="flex:1;" onclick="openEditCat('${c.id}')">✏️ Edit</button>
                <button class="btn btn-icon btn-sm" title="Delete" onclick="openDeleteCat('${c.id}','${(c.name??'').replace(/'/g,"\\'")}')">🗑️</button>
            </div>
        </div>
    </div>`).join('');
}

/* ── Add ── */
document.getElementById('addCatBtn').addEventListener('click', () => {
    clearCatModal();
    document.getElementById('catModalTitle').textContent = 'Add Category';
    document.getElementById('editCatId').value = '';
    openModal('catModal');
});

/* ── Edit ── */
window.openEditCat = id => {
    const c = allCategories.find(x => x.id === id);
    if (!c) return;
    clearCatModal();
    document.getElementById('catModalTitle').textContent = 'Edit Category';
    document.getElementById('editCatId').value     = id;
    document.getElementById('cName').value         = c.name ?? '';
    document.getElementById('cDescription').value  = c.description ?? '';
    document.getElementById('cIcon').value         = c.icon ?? '';
    document.getElementById('cImageUrl').value     = c.imageUrl ?? '';
    document.getElementById('cFeatured').checked   = !!c.featured;
    previewCatImg(c.imageUrl ?? '');
    openModal('catModal');
};

/* ── Save ── */
document.getElementById('saveCatBtn').addEventListener('click', async () => {
    const id   = document.getElementById('editCatId').value;
    const name = document.getElementById('cName').value.trim();
    if (!name) { showToast('Category name is required.', 'error'); return; }

    const data = {
        name,
        description : document.getElementById('cDescription').value.trim() || '',
        icon        : document.getElementById('cIcon').value.trim() || '🏷️',
        imageUrl    : document.getElementById('cImageUrl').value.trim() || null,
        featured    : document.getElementById('cFeatured').checked,
    };

    const btn = document.getElementById('saveCatBtn');
    btn.innerHTML = '<span class="spinner"></span>';
    btn.disabled  = true;

    try {
        if (id) {
            await updateDoc(doc(db, 'categories', id), data);
            showToast('Category updated!');
        } else {
            await addDoc(collection(db, 'categories'), data);
            showToast('Category added!');
        }
        closeModal('catModal');
        await loadCategories();
    } catch(e) {
        showToast('Error: ' + e.message, 'error');
    } finally {
        btn.textContent = 'Save Category';
        btn.disabled = false;
    }
});

/* ── Delete ── */
window.openDeleteCat = (id, name) => {
    pendingDeleteId = id;
    document.getElementById('deleteCatName').textContent = name;
    openModal('deleteCatModal');
};

document.getElementById('confirmDeleteCatBtn').addEventListener('click', async () => {
    if (!pendingDeleteId) return;
    const btn = document.getElementById('confirmDeleteCatBtn');
    btn.innerHTML = '<span class="spinner"></span>';
    btn.disabled  = true;
    try {
        await deleteDoc(doc(db, 'categories', pendingDeleteId));
        showToast('Category deleted.', 'info');
        closeModal('deleteCatModal');
        await loadCategories();
    } catch(e) {
        showToast('Error: ' + e.message, 'error');
    } finally {
        btn.textContent = 'Delete';
        btn.disabled = false;
        pendingDeleteId = null;
    }
});

/* ── Modal helpers ── */
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function clearCatModal() {
    ['cName','cDescription','cIcon','cImageUrl'].forEach(id => {
        const el = document.getElementById(id); if(el) el.value = '';
    });
    document.getElementById('cFeatured').checked = false;
    const img = document.getElementById('catImgPreview');
    img.src = ''; img.style.display = 'none';
}

document.getElementById('closeCatModal').addEventListener('click', () => closeModal('catModal'));
document.getElementById('cancelCatBtn').addEventListener('click', () => closeModal('catModal'));
document.getElementById('closeDeleteCatModal').addEventListener('click', () => closeModal('deleteCatModal'));
document.getElementById('cancelDeleteCatBtn').addEventListener('click', () => closeModal('deleteCatModal'));

window.previewCatImg = url => {
    const img = document.getElementById('catImgPreview');
    if (url) { img.src = url; img.style.display = 'block'; }
    else     { img.src = ''; img.style.display = 'none'; }
};

/* ── Init ── */
await loadCategories();
</script>
</body>
</html>
