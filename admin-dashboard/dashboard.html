<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — OpticShop Admin</title>
    <link rel="stylesheet" href="css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</head>
<body>
<!-- ── Sidebar ── -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
        <div class="logo-icon">👓</div>
        <span>OpticShop</span>
    </div>
    <nav class="sidebar-nav">
        <span class="nav-section-label">Main</span>
        <a href="dashboard.html"  class="nav-link active"><span class="nav-icon">📊</span>Dashboard</a>
        <a href="products.html"   class="nav-link"><span class="nav-icon">🛍️</span>Products</a>
        <a href="categories.html" class="nav-link"><span class="nav-icon">🏷️</span>Categories</a>
        <a href="orders.html"     class="nav-link"><span class="nav-icon">📦</span>Orders</a>
    </nav>
    <div class="sidebar-footer">
        <button class="nav-link" id="logoutBtn" style="width:100%;background:none;border:none;cursor:pointer;color:rgba(255,255,255,.65);font-size:14px;font-weight:500;">
            <span class="nav-icon">🚪</span>Logout
        </button>
    </div>
</aside>

<!-- ── Main ── -->
<div class="main-wrapper">
    <header class="topbar">
        <span class="topbar-title">Dashboard</span>
        <div class="topbar-right">
            <span id="adminEmail" style="font-size:13px;color:var(--text-muted);"></span>
            <div class="admin-avatar" id="adminAvatar">A</div>
        </div>
    </header>

    <main class="page-content">
        <!-- Stat cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon orange">💰</div>
                <div>
                    <div class="stat-value" id="statRevenue">—</div>
                    <div class="stat-label">Total Revenue</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon blue">📦</div>
                <div>
                    <div class="stat-value" id="statOrders">—</div>
                    <div class="stat-label">Total Orders</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green">🛍️</div>
                <div>
                    <div class="stat-value" id="statProducts">—</div>
                    <div class="stat-label">Products</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon purple">👥</div>
                <div>
                    <div class="stat-value" id="statCustomers">—</div>
                    <div class="stat-label">Customers</div>
                </div>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts-row">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Revenue — Last 7 Days</span>
                </div>
                <canvas id="revenueChart" height="100"></canvas>
            </div>
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Orders by Status</span>
                </div>
                <canvas id="statusChart" height="200"></canvas>
            </div>
        </div>

        <!-- Recent orders + Top products -->
        <div style="display:grid;grid-template-columns:3fr 2fr;gap:20px;">
            <!-- Recent orders -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Recent Orders</span>
                    <a href="orders.html" class="btn btn-secondary btn-sm">View All</a>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="recentOrdersBody">
                            <tr><td colspan="5" class="text-muted" style="text-align:center;padding:24px;">Loading…</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Top products -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Top Products</span>
                </div>
                <div id="topProductsList">
                    <p class="text-muted" style="text-align:center;padding:24px;">Loading…</p>
                </div>
            </div>
        </div>
    </main>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import {
    auth, db, requireAuth, showToast,
    collection, collectionGroup, getDocs, query, orderBy, limit, where,
    signOut, onAuthStateChanged, getCountFromServer
} from './js/firebase-config.js';

/* ── Auth guard ── */
const user = await requireAuth();
document.getElementById('adminEmail').textContent = user.email;
document.getElementById('adminAvatar').textContent = (user.email?.[0] ?? 'A').toUpperCase();

document.getElementById('logoutBtn').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = 'index.html';
});

/* ── Helpers ── */
const fmt = n => n?.toLocaleString('en-US', { style:'currency', currency:'EGP', maximumFractionDigits:0 }) ?? '—';

const STATUS_BADGE = {
    pending:    'badge-warning',
    confirmed:  'badge-info',
    processing: 'badge-info',
    shipped:    'badge-orange',
    delivered:  'badge-success',
    cancelled:  'badge-danger',
};

/* ── Load stats ── */
async function loadStats() {
    try {
        const [orderSnap, productSnap, userSnap] = await Promise.all([
            getDocs(collectionGroup(db, 'orders')),
            getCountFromServer(collection(db, 'products')),
            getCountFromServer(collection(db, 'users')),
        ]);

        let totalRevenue = 0;
        orderSnap.forEach(d => { totalRevenue += d.data().total ?? 0; });

        document.getElementById('statRevenue').textContent  = fmt(totalRevenue);
        document.getElementById('statOrders').textContent   = orderSnap.size;
        document.getElementById('statProducts').textContent = productSnap.data().count;
        document.getElementById('statCustomers').textContent= userSnap.data().count;
    } catch(e) { console.error('Stats:', e); }
}

/* ── Revenue last 7 days ── */
async function loadRevenueChart() {
    const days   = [];
    const labels = [];
    const values = [];

    for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        d.setHours(0,0,0,0);
        days.push(d);
        labels.push(d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' }));
        values.push(0);
    }

    try {
        const snap = await getDocs(collectionGroup(db, 'orders'));
        snap.forEach(doc => {
            const data = doc.data();
            const ts   = data.createdAt?.toDate?.() ?? (data.createdAt ? new Date(data.createdAt) : null);
            if (!ts) return;
            for (let i = 0; i < days.length; i++) {
                const next = new Date(days[i]); next.setDate(next.getDate() + 1);
                if (ts >= days[i] && ts < next) { values[i] += data.total ?? 0; break; }
            }
        });
    } catch(e) { console.error('Chart:', e); }

    new Chart(document.getElementById('revenueChart'), {
        type: 'line',
        data: {
            labels,
            datasets: [{
                label: 'Revenue (EGP)',
                data: values,
                borderColor: '#FF6B35',
                backgroundColor: 'rgba(255,107,53,.1)',
                borderWidth: 2.5,
                pointBackgroundColor: '#FF6B35',
                pointRadius: 4,
                tension: .4,
                fill: true,
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                x: { grid: { display: false } },
                y: { grid: { color: '#f1f5f9' }, beginAtZero: true,
                     ticks: { callback: v => 'EGP ' + v.toLocaleString() } }
            }
        }
    });
}

/* ── Status doughnut ── */
async function loadStatusChart() {
    const counts = { pending:0, confirmed:0, shipped:0, delivered:0, cancelled:0 };
    try {
        const snap = await getDocs(collectionGroup(db, 'orders'));
        snap.forEach(d => {
            const s = d.data().status ?? 'pending';
            if (s in counts) counts[s]++;
            else counts['pending']++;
        });
    } catch(e) { console.error('Status chart:', e); }

    new Chart(document.getElementById('statusChart'), {
        type: 'doughnut',
        data: {
            labels: Object.keys(counts).map(k => k.charAt(0).toUpperCase() + k.slice(1)),
            datasets: [{
                data: Object.values(counts),
                backgroundColor: ['#f59e0b','#3b82f6','#FF6B35','#22c55e','#ef4444'],
                borderWidth: 2,
                borderColor: '#fff',
            }]
        },
        options: {
            cutout: '65%',
            plugins: {
                legend: { position: 'bottom', labels: { padding: 12, font: { size: 12 } } }
            }
        }
    });
}

/* ── Recent orders ── */
async function loadRecentOrders() {
    const tbody = document.getElementById('recentOrdersBody');
    try {
        const snap = await getDocs(collectionGroup(db, 'orders'));
        const orders = [];
        snap.forEach(d => orders.push({ id: d.id, ...d.data() }));
        orders.sort((a,b) => {
            const ta = a.createdAt?.toDate?.()?.getTime() ?? 0;
            const tb = b.createdAt?.toDate?.()?.getTime() ?? 0;
            return tb - ta;
        });
        const recent = orders.slice(0, 8);

        if (recent.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-muted" style="text-align:center;padding:24px;">No orders yet.</td></tr>`;
            return;
        }

        tbody.innerHTML = recent.map(o => {
            const date  = o.createdAt?.toDate?.()?.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}) ?? '—';
            const badge = STATUS_BADGE[o.status] ?? 'badge-muted';
            const name  = o.userName ?? o.userEmail?.split('@')[0] ?? 'Customer';
            return `
            <tr>
                <td><span class="fw-bold fs-12">#${o.id.slice(-6).toUpperCase()}</span></td>
                <td>${name}</td>
                <td class="fw-bold">${fmt(o.total)}</td>
                <td><span class="badge ${badge}">${o.status ?? 'pending'}</span></td>
                <td class="text-muted fs-12">${date}</td>
            </tr>`;
        }).join('');
    } catch(e) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-danger" style="text-align:center;padding:24px;">Failed to load orders.</td></tr>`;
        console.error(e);
    }
}

/* ── Top products ── */
async function loadTopProducts() {
    const el = document.getElementById('topProductsList');
    try {
        const snap = await getDocs(collectionGroup(db, 'orders'));

        // Aggregate product sales from order items
        const productRevMap = {};
        snap.forEach(d => {
            const items = d.data().items ?? [];
            items.forEach(item => {
                const pid = item.productId ?? item.id ?? item.name;
                if (!pid) return;
                if (!productRevMap[pid]) productRevMap[pid] = { name: item.name ?? pid, total: 0, qty: 0 };
                productRevMap[pid].total += (item.price ?? 0) * (item.quantity ?? 1);
                productRevMap[pid].qty   += item.quantity ?? 1;
            });
        });

        const sorted = Object.entries(productRevMap)
            .sort((a,b) => b[1].total - a[1].total)
            .slice(0, 6);

        if (sorted.length === 0) {
            el.innerHTML = `<p class="text-muted" style="text-align:center;padding:24px;">No data yet.</p>`;
            return;
        }

        const maxRevenue = sorted[0][1].total || 1;
        el.innerHTML = sorted.map(([, v]) => `
            <div style="margin-bottom:14px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                    <span style="font-size:13px;font-weight:600;">${v.name}</span>
                    <span style="font-size:12px;color:var(--text-muted);">${fmt(v.total)}</span>
                </div>
                <div style="height:6px;background:#f1f5f9;border-radius:3px;">
                    <div style="height:100%;width:${Math.round(v.total/maxRevenue*100)}%;background:var(--accent);border-radius:3px;"></div>
                </div>
                <span style="font-size:11px;color:var(--text-muted);">${v.qty} sold</span>
            </div>`).join('');
    } catch(e) {
        el.innerHTML = `<p class="text-danger" style="text-align:center;padding:24px;">Failed to load.</p>`;
        console.error(e);
    }
}

/* ── Run all ── */
await Promise.all([
    loadStats(),
    loadRevenueChart(),
    loadStatusChart(),
    loadRecentOrders(),
    loadTopProducts(),
]);
</script>
</body>
</html>
